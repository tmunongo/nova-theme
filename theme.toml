# theme.toml template for Hugo
name = "Nova"
license = "MIT"
licenselink = "https://github.com/tmunongo/nova/blob/main/LICENSE"
description = "A sleek, dark and light minimalist theme with unified layout widths, customizable terminology, and modular optional sections."
homepage = "https://github.com/tmunongo/nova"
demosite = ""
tags = [
  "blog",
  "minimal",
  "portfolio",
  "clean",
  "dark",
  "light",
  "terminal",
  "responsive",
  "developer",
  "typography",
  "code-highlighting",
  "mermaid",
  "vanilla-js"
]
features = [
  "dark and light modes",
  "zero-flicker theme toggle with system preference detection",
  "consistent unified container width across all pages",
  "fully customizable labels and terminology",
  "modular optional sections (projects, notes, recommended reads, cta)",
  "reading progress indicator",
  "interactive tag & year filter",
  "micro-essay notes stream",
  "project showcase with live links",
  "mermaid diagram support with dark/light switching",
  "code copy buttons",
  "fast vanilla assets without heavy dependencies",
  "seo and open graph ready"
]
min_version = "0.120.0"

[author]
  name = "Tawanda Munongo"
  homepage = "https://github.com/tmunongo"
