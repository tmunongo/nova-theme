baseURL = "https://example.org/"
languageCode = "en-us"
title = "My Blog"
theme = "nova"

[taxonomies]
  tag = "tags"
  series = "series"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # Allows raw HTML in markdown when needed
  [markup.highlight]
    noClasses = false
    guessSyntax = true
    lineNos = false

[params]
  description = "A clean, dark & light minimalist theme with a unified reading width."
  logo_text = "nova"

  # Theme mode: "auto" (follows system OS preference), "dark", or "light"
  default_theme = "auto"

  # Unified container width: prevents jarring width jumps across pages
  # Recommended: "860px", "880px", or "900px"
  container_width = "880px"

  [params.author]
    name = "Author Name"
    fediverse = ""

  [params.social]
    github = "example"
    # twitter = "example"
    # fediverse = "https://example.social/@example"

  # Optional Hero on Home Page (leave empty or remove to disable)
  [params.hero]
    role = "Software Engineer & Writer"
    title = ""
    description = "Writing about software engineering, distributed systems, and modern technology."

  # Feature Toggles (All optional!)
  [params.features]
    recommended = true   # Set to false to disable the Recommended Reads section
    projects = true      # Set to false if you do not want a Projects section

  # Optional Call-To-Action (Disabled by default)
  [params.cta]
    enable = false
    title = "Need Something Built?"
    text = "Available for select engineering and advisory contracts."
    button_text = "Get In Touch →"
    url = "/about/"

  # ----------------------------------------------------------------------------
  # Customizable Labels / Terminology
  # Use standard terms (default) or customize with your own personal branding
  # (e.g., Signal, Substrate, Forge, Observatory, Workbench):
  # ----------------------------------------------------------------------------
  [params.labels]
    posts = "Posts"                     # e.g. "The Signal"
    latest_posts = "Latest Posts"       # e.g. "Latest Signals"
    all_posts = "All posts (%d) →"
    recommended = "Recommended Reads"
    notes = "Notes"                     # e.g. "The Substrate"
    all_notes = "All Notes"
    projects = "Projects"               # e.g. "The Forge"
    all_projects = "All projects →"
    project_live = "live"
    project_source = "source"
    filter_year = "Year"
    filter_tags = "Tags"
    filter_all = "All"
    clear_filters = "clear filters"
    no_posts = "No posts published yet."
    no_matching_posts = "No posts match the selected filters."

# ----------------------------------------------------------------------------
# Navigation Menu
# Keep it barebones (e.g. Posts & About) or add Notes, Projects, etc.
# ----------------------------------------------------------------------------
[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    name = "Notes"
    url = "/notes/"
    weight = 20

  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 30

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 40

  # Example CTA menu button with custom styling:
  # [[menu.main]]
  #   name = "Workbench"
  #   url = "/consulting/"
  #   weight = 50
  #   [menu.main.params]
  #     class = "workbench-cta"
