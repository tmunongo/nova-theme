{{ define "main" }}
  <article class="blog-post">
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      <div class="post-meta mono">
        <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
          {{ .Date.Format "January 02, 2006" }}
        </time>
        {{ with site.GetPage "section" "notes" }}
          <span>&bull; <a href="{{ .RelPermalink }}#{{ $.File.ContentBaseName }}">&larr; {{ $.Site.Params.labels.all_notes | default "All Notes" }}</a></span>
        {{ end }}
      </div>
      {{ with .Params.tags }}
        <div class="post-tags">
          {{ range . }}
            <span class="tag">#{{ . }}</span>
          {{ end }}
        </div>
      {{ end }}
    </header>

    <div class="post-content prose">
      {{ .Content }}
    </div>
  </article>
{{ end }}
