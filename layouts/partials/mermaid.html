<script type="module">
  (async function setupMermaid() {
    const mermaidElements = document.querySelectorAll(
      'pre.mermaid, pre > code.language-mermaid, .mermaid, pre[data-language="mermaid"], code[class*="mermaid"]'
    );
    if (!mermaidElements.length) return;

    try {
      const mermaidModule = await import(
        'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'
      );
      const mermaid = mermaidModule.default || mermaidModule;

      function getThemeVariables(isLight) {
        if (isLight) {
          return {
            darkMode: false,
            background: '#f0eee6',
            mainBkg: '#f0eee6',
            textColor: '#18191b',
            primaryColor: '#e4e2d8',
            primaryTextColor: '#18191b',
            primaryBorderColor: '#1b5ed9',
            lineColor: '#1b5ed9',
            secondaryColor: '#faf9f6',
            tertiaryColor: '#f0eee6',
            noteBkgColor: '#f0eee6',
            noteTextColor: '#18191b',
            noteBorderColor: '#0b7c3d',
            actorBkg: '#e4e2d8',
            actorBorder: '#1b5ed9',
            actorTextColor: '#18191b',
            actorLineColor: '#1b5ed9',
            signalColor: '#0b7c3d',
            signalTextColor: '#18191b',
            labelBoxBkgColor: '#e4e2d8',
            labelBoxBorderColor: '#1b5ed9',
            labelTextColor: '#18191b',
            loopTextColor: '#18191b',
            edgeLabelBackground: '#f0eee6',
            clusterBkg: '#faf9f6',
            clusterBorder: 'rgba(0, 0, 0, 0.15)',
            nodeBorder: '#1b5ed9',
            defaultLinkColor: '#1b5ed9',
            titleColor: '#18191b',
          };
        }
        return {
          darkMode: true,
          background: '#1a1c1f',
          mainBkg: '#1a1c1f',
          textColor: '#e7e7e2',
          primaryColor: '#1e2227',
          primaryTextColor: '#e7e7e2',
          primaryBorderColor: '#6aa6ff',
          lineColor: '#6aa6ff',
          secondaryColor: '#16181b',
          tertiaryColor: '#0f0f11',
          noteBkgColor: '#16181b',
          noteTextColor: '#e7e7e2',
          noteBorderColor: '#26d07c',
          actorBkg: '#1e2227',
          actorBorder: '#6aa6ff',
          actorTextColor: '#e7e7e2',
          actorLineColor: '#6aa6ff',
          signalColor: '#26d07c',
          signalTextColor: '#e7e7e2',
          labelBoxBkgColor: '#1e2227',
          labelBoxBorderColor: '#6aa6ff',
          labelTextColor: '#e7e7e2',
          loopTextColor: '#e7e7e2',
          edgeLabelBackground: '#1a1c1f',
          clusterBkg: '#141618',
          clusterBorder: 'rgba(255, 255, 255, 0.1)',
          nodeBorder: '#6aa6ff',
          defaultLinkColor: '#6aa6ff',
          titleColor: '#e7e7e2',
        };
      }

      // Collect entries, deduplicating by targetPre so a pre>code pair only produces one diagram
      const entries = [];
      const seenPres = new Set();
      mermaidElements.forEach((el, index) => {
        const targetPre = el.tagName.toLowerCase() === 'code' ? el.closest('pre') : el;
        if (!targetPre || seenPres.has(targetPre)) return;
        seenPres.add(targetPre);

        const rawCode = (el.textContent || '').trim();
        const placeholder = document.createElement('div');
        placeholder.className = 'mermaid-rendered-container';
        placeholder.style.overflowX = 'auto';
        placeholder.style.margin = '2rem 0';
        placeholder.style.textAlign = 'center';
        // Insert placeholder but keep targetPre visible until render succeeds
        targetPre.parentNode.insertBefore(placeholder, targetPre);

        entries.push({
          id: 'mermaid-diagram-' + index,
          code: rawCode,
          container: placeholder,
          sourcePre: targetPre,
        });
      });

      let renderToken = 0;

      async function renderAll() {
        const token = ++renderToken;
        const isLight = document.documentElement.getAttribute('data-theme') === 'light' ||
          (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: light)').matches);

        mermaid.initialize({
          startOnLoad: false,
          theme: 'base',
          securityLevel: 'loose',
          fontFamily: '"Berkeley Mono", "IBM Plex Mono", Consolas, monospace',
          themeVariables: getThemeVariables(isLight),
        });

        for (let i = 0; i < entries.length; i++) {
          // Bail if a newer render was requested while we were awaiting
          if (token !== renderToken) return;
          const entry = entries[i];
          try {
            const uniqueId = entry.id + '-' + token;
            const { svg, bindFunctions } = await mermaid.render(uniqueId, entry.code);
            if (token !== renderToken) return;
            entry.container.innerHTML = svg;
            if (typeof bindFunctions === 'function') {
              bindFunctions(entry.container);
            }
            // Hide source only after a successful render
            entry.sourcePre.style.display = 'none';
          } catch (err) {
            console.error('Mermaid render error:', err);
            // Leave sourcePre visible so the user sees the raw diagram source
            entry.container.innerHTML = '';
            entry.sourcePre.style.display = '';
            const stray = document.getElementById(uniqueId) || document.getElementById('d' + uniqueId);
            if (stray) stray.remove();
          }
        }
      }

      // Register theme-change listener BEFORE the initial render so no change is missed
      window.addEventListener('nova:theme-change', () => {
        renderAll();
      });

      await renderAll();
    } catch (e) {
      console.warn('Could not load Mermaid library:', e);
    }
  })();
</script>
